name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"

      # Qt needs these to load; napari's canvas needs OpenGL, which Mesa gives on a virtual X display.
      - name: Qt's libraries and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1 libglx-mesa0 libgl1-mesa-dri \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libdbus-1-3 libfontconfig1

      - run: uv sync --locked

      - run: uv run ruff check .

      - run: uv run ruff format --check .

      - name: pytest (offscreen, on the virtual display for OpenGL)
        run: xvfb-run -a uv run pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
